name: Index new Discord links

# The Substack half of the index is a manual export that only exists on a
# laptop, so this job never runs build-index.py. It reads the committed
# data/nibble.json, adds whatever Discord posted since yesterday, and rebuilds
# the page from both.
on:
  schedule:
    - cron: '17 4 * * *'      # 04:17 UTC daily, off the hour to dodge the rush
  workflow_dispatch:           # and on demand, from the Actions tab

concurrency:
  group: index
  cancel-in-progress: false    # never let two runs race on the same commit

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # a wedged fetch should fail, not idle for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Set DISCORD_GUILD_ID and every public channel is found automatically,
      # including ones created after this workflow was written. Set
      # DISCORD_CHANNEL_IDS instead to pin the list by hand.
      - name: Harvest new messages
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
          DISCORD_EXCLUDE_CHANNELS: ${{ vars.DISCORD_EXCLUDE_CHANNELS }}
          DISCORD_TOKEN_TYPE: ${{ vars.DISCORD_TOKEN_TYPE || 'bot' }}
        run: python3 fetch-discord.py

      - name: Fetch titles and blurbs for new links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 enrich-links.py --limit 200

      - name: Rebuild the page
        run: python3 build-page.py

      # Rebuilt whenever the entry count moved, not on a calendar. The page
      # falls back to embedding in-browser when the row count does not match,
      # and at a few thousand entries that fallback locks the tab for a minute
      # - so a stale vectors.f32 is a broken page, not a slower one.
      - name: Rebuild smart-search vectors (only when the index moved)
        run: |
          if python3 vectors-stale.py; then
            pip install --quiet onnxruntime tokenizers numpy
            python3 build-vectors.py
          else
            echo "vectors already match the index - nothing to rebuild"
          fi

      - name: Commit
        run: |
          git config user.name  'nibble-indexer'
          git config user.email 'actions@users.noreply.github.com'
          git add data/ index.html vectors.f32 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing new today"
          else
            git commit -m "Index new Discord links ($(date -u +%Y-%m-%d))"
            # the concurrency group serialises this job against itself, but a
            # human commit landing mid-run would still reject the push
            for i in 1 2 3; do
              git push && break
              echo "push rejected, rebasing on origin (attempt $i)"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            done
          fi
